<title>The Log</title>
<style>
  :root{
    --bg:#0B1E33;
    --surface:#122A45;
    --surface-2:#1A3654;
    --ink:#EAF2FA;
    --ink-dim:#8FA9C2;
    --sage:#2E4A66;
    --gold:#4FC3F7;
    --red:#C1571F;
    --amber:#C98A4E;
    --radius:10px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:78px;
  }
  .mono{font-family:ui-monospace,"SF Mono","Cascadia Code","Courier New",monospace;}
  header.top{
    padding:22px 18px 14px;
    border-bottom:1px solid var(--sage);
    position:sticky;top:0;background:var(--bg);z-index:5;
  }
  header.top .eyebrow{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    font-family:ui-monospace,monospace;
  }
  header.top h1{margin:4px 0 2px;font-size:22px;font-weight:700;letter-spacing:.01em;}
  header.top .sub{color:var(--ink-dim);font-size:13px;}
  main{padding:16px 18px 30px;max-width:560px;margin:0 auto;}
  .card{
    background:var(--surface);
    border:1px solid var(--sage);
    border-radius:var(--radius);
    padding:14px 14px;
    margin-bottom:14px;
    box-shadow:0 6px 16px -8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .card h2{
    font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-dim);
    margin:0 0 10px;font-family:ui-monospace,monospace;
  }
  .habit-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 4px;border-bottom:1px dashed rgba(159,176,164,.25);
  }
  .habit-row:last-child{border-bottom:none;}
  .metal-line{
    position:relative;display:flex;align-items:center;gap:12px;
    padding:6px 8px;border-radius:8px;overflow:hidden;width:100%;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), inset 0 2px 5px rgba(0,0,0,.4);
  }
  .metal-line>*{position:relative;z-index:1;}

    position:absolute;inset:3px;z-index:0;border-radius:6px;

  }
  .metal-panel::before{
    content:'';position:absolute;inset:0;border-radius:6px;pointer-events:none;
    background:
      radial-gradient(circle 3px at 12px 50%, rgba(255,255,255,.9), rgba(0,0,0,.55) 70%, transparent 71%),
      radial-gradient(circle 3px at calc(100% - 12px) 50%, rgba(255,255,255,.9), rgba(0,0,0,.55) 70%, transparent 71%),
      linear-gradient(180deg, rgba(0,0,0,.5), rgba(255,255,255,.18) 45%, rgba(0,0,0,.5));
    background-repeat:no-repeat;
    background-size:auto, auto, 2px 78%;
    background-position:left center, right center, 63% center;
  }
  .metal-panel.metal-settled{ transform:translateX(0); }
  .metal-panel.metal-in{ animation:metalSlideIn 1050ms cubic-bezier(.6,.02,.3,1) forwards; }
  .metal-panel.metal-in::after{
    content:'';position:absolute;inset:0;border-radius:6px;
    background:linear-gradient(75deg, transparent 46%, rgba(255,255,255,.85) 50%, transparent 54%);
    transform:translateX(-160%);
    animation:metalShine 340ms ease-out 970ms forwards;
  }
  .metal-panel.metal-out{ animation:metalSlideOut 620ms cubic-bezier(.7,0,.85,.4) forwards; }
  @keyframes metalSlideIn{
    0%{ transform:translateX(-114%); }
    14%{ transform:translateX(-105%); }
    80%{ transform:translateX(-7%); }
    91%{ transform:translateX(-1.2%); }
    96%{ transform:translateX(1.4%); }
    100%{ transform:translateX(0); }
  }
  @keyframes metalSlideOut{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-114%); }
  }
  @keyframes metalShine{
    to{ transform:translateX(160%); }
  }
  .metal-line.locking{ animation:lockShake 260ms ease-out 960ms; }
  @keyframes lockShake{
    0%{ transform:translateX(0); }
    30%{ transform:translateX(-2px); }
    58%{ transform:translateX(1.5px); }
    82%{ transform:translateX(-1px); }
    100%{ transform:translateX(0); }
  }
  .metal-line.etched .habit-name,
  .metal-line.etched .habit-name small,
  .metal-line.etched .streak-badge{
    color:rgba(11,30,51,.82);
    text-shadow:0 1px 0 rgba(255,255,255,.4), 0 -1px 1px rgba(0,0,0,.35);
  }
  .metal-line.etched.harsh .habit-name,
  .metal-line.etched.harsh .habit-name small,
  .metal-line.etched.harsh .streak-badge{
    color:rgba(234,242,250,.92);
    text-shadow:0 -1px 1px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.18);
  }
  .chk{
    flex:0 0 auto;width:34px;height:34px;border-radius:8px;
    border:2px solid var(--sage);background:transparent;color:transparent;
    font-size:18px;font-weight:700;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s, border-color .15s, color .15s, transform .1s;
  }
  .chk:active{transform:scale(.92);}
  .chk.done{background:var(--gold);border-color:var(--gold);color:#0B1E33;}
  .chk.pop{animation:chkPop 300ms cubic-bezier(.2,.8,.3,1) 940ms backwards;}
  @keyframes chkPop{
    0%{transform:scale(.75);opacity:.6;}
    100%{transform:scale(1);opacity:1;}
  }
  .chk-neg{border-color:var(--red);}
  .chk-neg.done{background:var(--red);border-color:var(--red);color:#EAF2FA;}
  .chk-neg-soft.done{background:var(--amber);border-color:var(--amber);color:#0B1E33;}
  .chk-pending{color:var(--amber);}
  .habit-name{flex:1 1 auto;font-size:15px;}

function stripUndefined(value){
  if(value===undefined) return null;
  if(Array.isArray(value)) return value.map(stripUndefined);
  if(value && typeof value==='object'){
    const out={};
    for(const k in value) out[k]=stripUndefined(value[k]);
    return out;
  }
  return value;
}
async function getOrDefault(key, def){
  try{
    const {db, doc, getDoc}=window.__fb;
    const ref=doc(db, 'users', window.currentUser.uid, 'store', key);
    const snap=await getDoc(ref);
    if(snap.exists() && snap.data().value!==undefined) return snap.data().value;
    return def;
  }catch(e){ return def; }
}
async function persist(key, value){
  try{
    const {db, doc, setDoc}=window.__fb;
    const ref=doc(db, 'users', window.currentUser.uid, 'store', key);
    await setDoc(ref, {value: stripUndefined(value)});
  }catch(e){ toast('Could not save — check connection'); }
}

/* ---------- state ---------- */
let habitsConfig, journalTrees, entries, settings, weightLog, activeTab='today';
let animId=null, animDir=null;
function metalClasses(id, doneNow, aId, aDir){
  let panel='metal-panel', chk='', line='';
  if(doneNow){
    panel += (id===aId && aDir==='in') ? ' metal-in' : ' metal-settled';
    if(id===aId && aDir==='in'){ chk=' pop'; line=' locking'; }
  }else if(id===aId && aDir==='out'){
    panel += ' metal-out';
  }
  return {panel, chk, line};
}
let journalDraft={treeId:null, index:0};

function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return fmtDate(new Date()); }
function niceDate(str){
  const d=new Date(str+'T00:00:00');
  return d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
}
function ensureEntry(dateStr){
  if(!entries[dateStr]) entries[dateStr]={habits:{}, quantities:{}, journal:{trees:{}, completed:[]}};
  if(!entries[dateStr].quantities) entries[dateStr].quantities={};
  return entries[dateStr];
}
function getHabitDef(id){
  return habitsConfig.positive.find(h=>h.id===id) || habitsConfig.negative.find(h=>h.id===id);
}
function habitDone(entry, def){
  if(!def) return false;
  if(def.kind==='weight') return false;
  if(def.kind==='quantity'){
    const q=entry.quantities && entry.quantities[def.id];
    return !!q && q.total >= (def.goal||0);
  }
  if(def.kind==='budget' || def.kind==='alcohol'){
    const q=entry.quantities && entry.quantities[def.id];
    return !!q && q.total > 0;
  }
  return !!entry.habits[def.id];
}

/* ---------- streak logic ---------- */
function sortedDates(){ return Object.keys(entries).sort(); }
function currentStreak(conditionFn){
  const dates=sortedDates();
  if(dates.length===0) return 0;
  let count=0;
  let cursor=new Date(dates[dates.length-1]+'T00:00:00');
  while(true){
    const key=fmtDate(cursor);
    const entry=entries[key];
    if(!entry || !conditionFn(entry, key)) break;
    count++;
    cursor.setDate(cursor.getDate()-1);
  }
  return count;
}
function bestStreak(conditionFn){
  const dates=sortedDates();
  let max=0, cur=0, prev=null;
  for(const d of dates){
    if(prev){
      const gap=(new Date(d)-new Date(prev))/86400000;
      if(gap!==1) cur=0;
    }
    if(conditionFn(entries[d], d)){ cur++; max=Math.max(max,cur); } else { cur=0; }
    prev=d;
  }
  return max;
}
function allTimeCount(habitId){
  const def=getHabitDef(habitId);
  return sortedDates().filter(d=>habitDone(entries[d], def)).length;
}
function quantityAllTime(def){
  let total=0;
  sortedDates().forEach(d=>{
    total += (entries[d].quantities && entries[d].quantities[def.id] && entries[d].quantities[def.id].total) || 0;
  });
  return total;
}
function bestPeriodStats(def){
  let allTime=0, bestDay={total:0,date:null};
  const weekMap={}, monthMap={}, yearMap={};
  sortedDates().forEach(d=>{
    const t=(entries[d].quantities && entries[d].quantities[def.id] && entries[d].quantities[def.id].total)||0;
    allTime+=t;
    if(t>bestDay.total) bestDay={total:t,date:d};
    const dateObj=new Date(d+'T00:00:00');
    const wk=sundayWeekKey(dateObj); weekMap[wk]=(weekMap[wk]||0)+t;
    const mo=d.slice(0,7); monthMap[mo]=(monthMap[mo]||0)+t;
    const yr=d.slice(0,4); yearMap[yr]=(yearMap[yr]||0)+t;
  });
  const bestOf=(map)=>{ let bk=null,bv=0; for(const k in map){ if(map[k]>bv){bv=map[k];bk=k;} } return {key:bk,total:bv}; };
  return { allTime, bestDay, bestWeek:bestOf(weekMap), bestMonth:bestOf(monthMap), bestYear:bestOf(yearMap) };
}
function formatMonthKey(k){
  const [y,m]=k.split('-');
  return new Date(y, m-1, 1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
}
function formatWeekKey(k){
  const d=new Date(k+'T00:00:00');
  return 'week of '+d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}
function cheatWeeklyCountThrough(dateStr, def){
  const wk=sundayWeekKey(new Date(dateStr+'T00:00:00'));
  let sum=0;
  sortedDates().forEach(d=>{
    if(d>dateStr) return;
    if(sundayWeekKey(new Date(d+'T00:00:00'))!==wk) return;
    sum += (entries[d].quantities && entries[d].quantities[def.id] && entries[d].quantities[def.id].total) || 0;
  });
  return sum;
}
function cheatStatus(def, dateStr){
  const entry=entries[dateStr];
  if(!entry) return 'none';
  const today=(entry.quantities && entry.quantities[def.id] && entry.quantities[def.id].total)||0;
  if(today===0) return 'none';
  if(today > (def.dailyLimit||1)) return 'harsh';
  if(cheatWeeklyCountThrough(dateStr, def) > (def.weeklyLimit||4)) return 'harsh';
  return 'soft';
}
function cheatViolationCount(def){
  return sortedDates().filter(d=>cheatStatus(def, d)==='harsh').length;
}
function prevDayDrinks(dateStr, def){
  const prevDate=new Date(dateStr+'T00:00:00'); prevDate.setDate(prevDate.getDate()-1);
  const prevEntry=entries[fmtDate(prevDate)];
  return (prevEntry && prevEntry.quantities && prevEntry.quantities[def.id] && prevEntry.quantities[def.id].total) || 0;
}
function alcoholTaxTarget(entry, def){
  const drinks=(entry.quantities && entry.quantities[def.id] && entry.quantities[def.id].total)||0;
  return drinks * (def.taxPerDrink||8);
}
function alcoholTaxPaid(entry, def){
  return (entry.quantities && entry.quantities[def.id+'_tax'] && entry.quantities[def.id+'_tax'].total) || 0;
}
function alcoholStatus(def, dateStr){
  const entry=entries[dateStr];
  if(!entry) return 'none';
  const drinks=(entry.quantities && entry.quantities[def.id] && entry.quantities[def.id].total)||0;
  if(drinks===0) return 'none';
  if(drinks > (def.dailyLimit||3)) return 'harsh';
  if(prevDayDrinks(dateStr, def) > 0) return 'harsh';
  if(alcoholTaxPaid(entry,def) < alcoholTaxTarget(entry,def)) return 'pending';
  return 'soft';
}
function alcoholViolationCount(def){
  return sortedDates().filter(d=>alcoholStatus(def, d)==='harsh').length;
}
function isPerfectDay(entry, dateStr){
  return allPositiveDone(entry, dateStr) && (dateStr ? allLimitsCompliant(entry, dateStr) : habitsConfig.negative.every(h=>!habitDone(entry,h)));
}
function allPositiveDone(entry, dateStr){
  const d=dateStr||todayStr();
  return habitsConfig.positive.filter(h=>h.kind!=='weight').every(h=>{
    if(h.kind==='weekly-goal') return weeklyGoalOk(h, d);
    return habitDone(entry,h);
  });
}
function weeklyGoalCountThrough(def, dateStr){
  const wk=sundayWeekKey(new Date(dateStr+'T00:00:00'));
  let count=0;
  sortedDates().forEach(d=>{
    if(d>dateStr) return;
    if(sundayWeekKey(new Date(d+'T00:00:00'))!==wk) return;
    if(entries[d].habits[def.id]) count++;
  });
  return count;
}
function weeklyGoalOk(def, dateStr){
  const isLastDayOfWeek=new Date(dateStr+'T00:00:00').getDay()===6;
  if(!isLastDayOfWeek) return true;
  return weeklyGoalCountThrough(def, dateStr) >= (def.weeklyGoal||0);
}
function allLimitsCompliant(entry, dateStr){
  return habitsConfig.negative.every(h=>{
    if(h.kind==='budget') return cheatStatus(h, dateStr)!=='harsh';
    if(h.kind==='alcohol'){
      const s=alcoholStatus(h, dateStr);
      return s==='none' || s==='soft';
    }
    return !habitDone(entry,h);
  });
}
function perfectDayCondition(){ return isPerfectDay; }
function sundayWeekKey(dateObj){
  const d=new Date(dateObj);
  d.setDate(d.getDate()-d.getDay());
  return fmtDate(d);
}

/* ---------- init ---------- */
async function init(){
  habitsConfig = await getOrDefault('habits-config', DEFAULT_HABITS);
  journalTrees = await getOrDefault('journal-trees', DEFAULT_TREES);
  entries = await getOrDefault('entries', {});
  settings = await getOrDefault('settings', {startDate: todayStr()});
  weightLog = await getOrDefault('weight-log', {});
  if(!settings.startDate){ settings.startDate=todayStr(); await persist('settings', settings); }
  migrateHabitsConfig();
  migrateJournalTrees();
  switchTab('today');
}
function migrateHabitsConfig(){
  let changed=false;
  const water=habitsConfig.positive.find(h=>h.id==='water');
  if(water && water.kind!=='quantity'){ water.kind='quantity'; water.goal=128; water.unit='oz'; changed=true; }
  if(water && water.name==='Water intake'){ water.name='Fluid Intake (Non-Sugary Drinks)'; changed=true; }
  const read=habitsConfig.positive.find(h=>h.id==='read');
  if(read && read.kind!=='quantity'){ read.kind='quantity'; read.goal=10; read.unit='pages'; read.trackLabel=true; read.periodStats=true; changed=true; }
  if(read && read.name==='Read (self-improvement)'){ read.name='Read (Self-Improvement)'; changed=true; }
  const photo=habitsConfig.positive.find(h=>h.id==='photo');
  if(photo && photo.name==='Progress picture'){ photo.name='Take a Progress Picture'; changed=true; }
  const workout=habitsConfig.positive.find(h=>h.id==='workout');
  if(workout && workout.name==='Workout'){ workout.name='Complete a Workout'; changed=true; }
  const cheat=habitsConfig.negative.find(h=>h.id==='cheat');
  if(cheat && cheat.kind!=='budget'){ cheat.kind='budget'; cheat.weeklyLimit=cheat.weeklyLimit||4; cheat.dailyLimit=cheat.dailyLimit||1; changed=true; }
  if(cheat && cheat.name==='Cheat meal / snack'){ cheat.name='Cheat Meal/Snack'; changed=true; }
  const alcohol=habitsConfig.negative.find(h=>h.id==='alcohol');
  if(alcohol && alcohol.kind!=='alcohol'){ alcohol.kind='alcohol'; alcohol.dailyLimit=alcohol.dailyLimit||3; alcohol.taxPerDrink=alcohol.taxPerDrink||8; changed=true; }
  if(alcohol && alcohol.name==='Alcohol'){ alcohol.name='Alcoholic Drink'; changed=true; }
  const eatingIdx=habitsConfig.positive.findIndex(h=>h.id==='eating');
  if(eatingIdx!==-1){ habitsConfig.positive.splice(eatingIdx,1); changed=true; }
  const bizWork=habitsConfig.positive.find(h=>h.id==='business_work');
  if(bizWork && bizWork.nestedUnder){ delete bizWork.nestedUnder; changed=true; }

  const newPositiveDefaults=[
    {id:'weight', name:'Weekly Weigh-In', kind:'weight', unit:'lbs'},
    {id:'morning_supplements', name:'Morning Supplements', kind:'check'},
    {id:'morning_protein', name:'Morning Protein', kind:'check'},
    {id:'afternoon_supplements', name:'Afternoon Supplements', kind:'check'},
    {id:'evening_supplements', name:'Evening Supplements', kind:'check'},
    {id:'after_workout_protein', name:'After Workout Protein', kind:'check', nestedUnder:'workout'},
    {id:'business_work', name:'Work on Business', kind:'weekly-goal', weeklyGoal:3}
  ];
  newPositiveDefaults.forEach(def=>{
    if(!habitsConfig.positive.find(h=>h.id===def.id)){ habitsConfig.positive.push(Object.assign({},def)); changed=true; }
  });

  const posOrder=['weight','morning_supplements','photo','morning_protein','water','afternoon_supplements','workout','after_workout_protein','business_work','read','journal','evening_supplements'];
  const knownPos=[], extraPos=[];
  habitsConfig.positive.forEach(h=>{ (posOrder.includes(h.id)?knownPos:extraPos).push(h); });
  knownPos.sort((a,b)=>posOrder.indexOf(a.id)-posOrder.indexOf(b.id));
  const reorderedPos=knownPos.concat(extraPos);
  if(reorderedPos.map(h=>h.id).join(',')!==habitsConfig.positive.map(h=>h.id).join(',')){
    habitsConfig.positive=reorderedPos; changed=true;
  }

  const negOrder=['cheat','alcohol'];
  const knownNeg=[], extraNeg=[];
  habitsConfig.negative.forEach(h=>{ (negOrder.includes(h.id)?knownNeg:extraNeg).push(h); });
  knownNeg.sort((a,b)=>negOrder.indexOf(a.id)-negOrder.indexOf(b.id));
  const reorderedNeg=knownNeg.concat(extraNeg);
  if(reorderedNeg.map(h=>h.id).join(',')!==habitsConfig.negative.map(h=>h.id).join(',')){
    habitsConfig.negative=reorderedNeg; changed=true;
  }

  if(changed) persist('habits-config', habitsConfig);
}
function migrateJournalTrees(){
  let changed=false;
  const isUntouchedStarterSet = journalTrees.length===2 && journalTrees.every(t=>['t1','t2'].includes(t.id));
  if(isUntouchedStarterSet){
    journalTrees=DEFAULT_TREES.map(t=>Object.assign({}, t, {prompts:t.prompts.slice()}));
    changed=true;
  }else{
    DEFAULT_TREES.forEach(def=>{
      if(!journalTrees.find(t=>t.id===def.id)){
        journalTrees.push(Object.assign({}, def, {prompts:def.prompts.slice()}));
        changed=true;
      }
    });
  }
  if(changed) persist('journal-trees', journalTrees);
}

function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='today') renderToday();
  else if(tab==='stats') renderStats();
  else if(tab==='journal') renderJournal();
  else if(tab==='settings') renderSettings();
}

/* ---------- TODAY ---------- */
function renderToday(){
  const t=todayStr();
  const entry=ensureEntry(t);
  document.getElementById('headerTitle').textContent=niceDate(t);
  document.getElementById('headerSub').textContent='';
  const curAnimId=animId, curAnimDir=animDir;
  animId=null; animDir=null;

  let html='';
  const perfect=isPerfectDay(entry, t);
  const perfectCur=currentStreak(perfectDayCondition());
  html+=`<div class="perfect-banner">
    <div class="stamp mono">${perfect ? 'PERFECT<br>DAY':'IN<br>PROGRESS'}</div>
    <div class="txt"><b>${perfectCur} day perfect streak</b>All check-ins, no slip-ups.</div>
  </div>`;

  html+='<div class="card"><h2>Do these</h2>';
  html+=renderWeightCheckin(t);
  habitsConfig.positive.forEach(h=>{
    if(h.nestedUnder) return;
    if(h.kind==='weight') return;
    const st=currentStreak(e=>habitDone(e,h));
    if(h.kind==='quantity'){
      const q=entry.quantities[h.id];
      const total=q?q.total:0;
      const done=total>=h.goal;
      const logs=q&&q.logs?q.logs:[];
      let logsHtml='';
      if(logs.length){
        logsHtml='<div class="muted mono" style="margin-top:6px;font-size:12px;">'+
          logs.map((l,i)=>`${l.amount}${h.unit}${l.label?' — '+l.label:''} <span onclick="removeQuantityLog('${h.id}',${i})" style="cursor:pointer;color:var(--red);">✕</span>`).join(' &nbsp;·&nbsp; ')
          +'</div>';
      }
      const mc=metalClasses(h.id, done, curAnimId, curAnimDir);
      html+=`<div class="habit-row" style="flex-direction:column;align-items:stretch;">
        <div class="metal-line ${done?'etched':''}${mc.line}" style="--metal-color:var(--gold);">
          <div class="${mc.panel}"></div>
          <div class="chk ${done?'done':''}${mc.chk}" style="cursor:default;">${done?'✓':''}</div>
          <div class="habit-name">${h.name}<small>${total} / ${h.goal} ${h.unit}</small></div>
          <div class="streak-badge ${st>0?'lit':''}">${st>0? '🔥 '+st : ''}</div>
        </div>
        <div class="row" style="margin-top:8px;">
          <input type="number" id="qty_${h.id}" placeholder="${h.unit}" style="max-width:90px;">
          ${h.trackLabel? `<input type="text" id="lbl_${h.id}" placeholder="Book title" value="${(settings.lastBook||'').replace(/"/g,'&quot;')}">` : ''}
          <button class="btn ghost" onclick="submitQuantity('${h.id}')">Add</button>
        </div>
        ${logsHtml}
      </div>`;
      html+=renderNestedChildren(h.id, done, entry, curAnimId, curAnimDir);
    }else if(h.kind==='weekly-goal'){
      const done=!!entry.habits[h.id];
      const count=weeklyGoalCountThrough(h, t);
      const met=count>=(h.weeklyGoal||0);
      const mc=metalClasses(h.id, done, curAnimId, curAnimDir);
      html+=`<div class="habit-row">
        <div class="metal-line ${done?'etched':''}${mc.line}" style="--metal-color:var(--gold);">
          <div class="${mc.panel}"></div>
          <button class="chk ${done?'done':''}${mc.chk}" onclick="toggleHabit('${h.id}')">${done?'✓':''}</button>
          <div class="habit-name">${h.name}<small>${count} / ${h.weeklyGoal} this week${met?' · goal met':''}</small></div>
        </div>
      </div>`;
      html+=renderNestedChildren(h.id, done, entry, curAnimId, curAnimDir);
    }else{
      const done=!!entry.habits[h.id];
      const mc=metalClasses(h.id, done, curAnimId, curAnimDir);
      html+=`<div class="habit-row">
        <div class="metal-line ${done?'etched':''}${mc.line}" style="--metal-color:var(--gold);">
          <div class="${mc.panel}"></div>
          <button class="chk ${done?'done':''}${mc.chk}" onclick="toggleHabit('${h.id}')">${done?'✓':''}</button>
          <div class="habit-name">${h.name}</div>
          <div class="streak-badge ${st>0?'lit':''}">${st>0? '🔥 '+st : ''}</div>
        </div>
      </div>`;
      html+=renderNestedChildren(h.id, done, entry, curAnimId, curAnimDir);
    }
  });
  html+='</div>';

  html+='<div class="card"><h2>Limit these</h2>';
  habitsConfig.negative.forEach(h=>{
    if(h.kind==='alcohol'){
      const q=entry.quantities[h.id];
      const drinks=q?q.total:0;
      const status=alcoholStatus(h, t);
      const taxTarget=alcoholTaxTarget(entry, h);
      const taxPaid=alcoholTaxPaid(entry, h);
      const settled=(status==='soft'||status==='harsh');
      const color=status==='harsh' ? '--red' : '--amber';
      const mc=metalClasses(h.id, settled, curAnimId, curAnimDir);
      let cls='chk chk-neg';
      if(status==='pending') cls+=' chk-pending';
      if(status==='soft'){ cls+=' chk-neg-soft done'; }
      if(status==='harsh'){ cls+=' done'; }
      cls += mc.chk;
      let note='';
      if(drinks>h.dailyLimit) note=' · over daily limit';
      else if(prevDayDrinks(t,h)>0) note=' · had drinks yesterday too';
      html+=`<div class="habit-row" style="flex-direction:column;align-items:stretch;">
        <div class="metal-line ${settled?'etched':''} ${status==='harsh'?'harsh':''}${mc.line}" style="--metal-color:var(${color});">
          <div class="${settled?mc.panel:''}"></div>
          <button class="${cls}" onclick="addQuantity('${h.id}',1)">${drinks>0?drinks:''}</button>
          <div class="habit-name">${h.name}<small>${drinks} / ${h.dailyLimit} today${note}</small></div>
        </div>
        ${drinks>0? `<button class="link-btn" style="align-self:flex-start;margin-top:4px;" onclick="removeQuantityLog('${h.id}',${drinks-1})">Undo last drink</button>`:''}
        ${drinks>0? `<div style="margin-top:8px;padding:10px;border:1px dashed var(--sage);border-radius:8px;">
          <div class="muted" style="margin-bottom:6px;">Water tax — ${taxPaid} / ${taxTarget} oz</div>
          <div class="row">
            <input type="number" id="qty_${h.id}_tax" placeholder="oz" style="max-width:90px;">
            <button class="btn ghost" onclick="submitQuantity('${h.id}_tax')">Add</button>
          </div>
        </div>` : ''}
      </div>`;
    }else if(h.kind==='budget'){
      const q=entry.quantities[h.id];
      const todayCount=q?q.total:0;
      const status=cheatStatus(h, t);
      const weekly=cheatWeeklyCountThrough(t, h);
      const settled=todayCount>0;
      const color=status==='harsh' ? '--red' : '--amber';
      const mc=metalClasses(h.id, settled, curAnimId, curAnimDir);
      let cls='chk chk-neg';
      if(status==='soft') cls+=' chk-neg-soft';
      if(todayCount>0) cls+=' done';
      cls += mc.chk;
      html+=`<div class="habit-row" style="flex-direction:column;align-items:stretch;">
        <div class="metal-line ${settled?'etched':''} ${status==='harsh'?'harsh':''}${mc.line}" style="--metal-color:var(${color});">
          <div class="${settled?mc.panel:''}"></div>
          <button class="${cls}" onclick="addQuantity('${h.id}',1)">${todayCount>0?todayCount:''}</button>
          <div class="habit-name">${h.name}<small>${weekly} / ${h.weeklyLimit} this week · max ${h.dailyLimit}/day</small></div>
        </div>
        ${todayCount>0? `<button class="link-btn" style="align-self:flex-start;margin-top:6px;" onclick="removeQuantityLog('${h.id}',${todayCount-1})">Undo last</button>` : ''}
      </div>`;
    }else{
      const done=habitDone(entry,h);
      const clean=currentStreak(e=>!habitDone(e,h));
      const mc=metalClasses(h.id, done, curAnimId, curAnimDir);
      html+=`<div class="habit-row">
        <div class="metal-line ${done?'etched harsh':''}${mc.line}" style="--metal-color:var(--red);">
          <div class="${mc.panel}"></div>
          <button class="chk chk-neg ${done?'done':''}${mc.chk}" onclick="toggleHabit('${h.id}')">${done?'✕':''}</button>
          <div class="habit-name">${h.name}<small>${done?'Logged today':'Not logged'}</small></div>
          <div class="streak-badge">${clean>0? clean+'d clean':''}</div>
        </div>
      </div>`;
    }
  });
  html+='</div>';

  document.getElementById('main').innerHTML=html;
}

function toggleHabit(id){
  const t=todayStr();
  const entry=ensureEntry(t);
  const before=wasFullyCompliant(t);
  const wasDone=!!entry.habits[id];
  animId=id; animDir=wasDone ? 'out' : 'in';
  entry.habits[id]=!entry.habits[id];
  saveEntriesSoon();
  checkCelebration(t, before);
  renderToday();
}
function wasFullyCompliant(dateStr){
  const entry=entries[dateStr];
  if(!entry) return false;
  return allPositiveDone(entry, dateStr) && allLimitsCompliant(entry, dateStr);
}
function checkCelebration(dateStr, before){
  const entry=entries[dateStr];
  if(!entry) return;
  if(!before && allPositiveDone(entry, dateStr) && allLimitsCompliant(entry, dateStr)){
    launchFireworks();
  }
}
function launchFireworks(){
  const overlay=document.createElement('div');
  overlay.id='fireworksOverlay';
  document.body.appendChild(overlay);
  const colors=['#4FC3F7','#C98A4E','#EAF2FA'];
  const bursts=5;
  for(let b=0;b<bursts;b++){
    setTimeout(()=>{
      const cx=15+Math.random()*70, cy=15+Math.random()*50;
      const particles=16;
      for(let i=0;i<particles;i++){
        const p=document.createElement('div');
        p.className='fw-particle';
        const angle=(Math.PI*2*i)/particles + Math.random()*0.3;
        const dist=60+Math.random()*70;
        p.style.left=cx+'vw';
        p.style.top=cy+'vh';
        p.style.background=colors[Math.floor(Math.random()*colors.length)];
        p.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
        p.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
        overlay.appendChild(p);
      }
    }, b*300);
  }
  setTimeout(()=>{ overlay.remove(); }, bursts*300+1300);
  toast('Perfect day! 🎆');
}
function renderWeightCheckin(t){
  const weightDef=habitsConfig.positive.find(h=>h.kind==='weight');
  if(!weightDef) return '';
  const wk=sundayWeekKey(new Date(t+'T00:00:00'));
  if(weightLog[wk]) return '';
  return `<div class="habit-row" style="flex-direction:column;align-items:stretch;background:var(--surface-2);border-radius:8px;padding:10px;margin-bottom:8px;border:1px dashed var(--gold);">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="chk" style="cursor:default;"></div>
      <div class="habit-name">${weightDef.name}<small>Once a week · doesn't affect your streak</small></div>
    </div>
    <div class="row" style="margin-top:8px;">
      <input type="number" id="weightInput" placeholder="${weightDef.unit}" style="max-width:100px;">
      <button class="btn ghost" onclick="submitWeight()">Log weight</button>
    </div>
  </div>`;
}
function submitWeight(){
  const el=document.getElementById('weightInput');
  const val=parseFloat(el?el.value:'');
  if(isNaN(val) || val<=0){ toast('Enter a valid weight'); return; }
  const t=todayStr();
  const wk=sundayWeekKey(new Date(t+'T00:00:00'));
  weightLog[wk]={value:val, dateLogged:t};
  persist('weight-log', weightLog);
  toast('Weight logged');
  renderToday();
}
function editWeight(weekKey){
  const current=weightLog[weekKey];
  const val=prompt('Update weight for week of '+weekKey+':', current?current.value:'');
  if(val===null) return;
  const num=parseFloat(val);
  if(isNaN(num) || num<=0){ toast('Enter a valid weight'); return; }
  weightLog[weekKey]={value:num, dateLogged: current?current.dateLogged:weekKey};
  persist('weight-log', weightLog);
  renderStats();
}
function renderNestedChildren(parentId, parentDone, entry, curAnimId, curAnimDir){
  if(!parentDone) return '';
  const children=habitsConfig.positive.filter(c=>c.nestedUnder===parentId);
  if(!children.length) return '';
  let out='';
  children.forEach(c=>{
    const cDone=!!entry.habits[c.id];
    const mc=metalClasses(c.id, cDone, curAnimId, curAnimDir);
    if(c.kind==='weekly-goal'){
      const t=todayStr();
      const count=weeklyGoalCountThrough(c, t);
      const met=count>=(c.weeklyGoal||0);
      out+=`<div class="habit-row" style="padding-left:46px;">
        <div class="metal-line ${cDone?'etched':''}${mc.line}" style="--metal-color:var(--gold);">
          <div class="${mc.panel}"></div>
          <button class="chk ${cDone?'done':''}${mc.chk}" onclick="toggleHabit('${c.id}')">${cDone?'✓':''}</button>
          <div class="habit-name">${c.name}<small>${count} / ${c.weeklyGoal} this week${met?' · goal met':''}</small></div>
        </div>
      </div>`;
    }else{
      out+=`<div class="habit-row" style="padding-left:46px;">
        <div class="metal-line ${cDone?'etched':''}${mc.line}" style="--metal-color:var(--gold);">
          <div class="${mc.panel}"></div>
          <button class="chk ${cDone?'done':''}${mc.chk}" onclick="toggleHabit('${c.id}')">${cDone?'✓':''}</button>
          <div class="habit-name">${c.name}</div>
        </div>
      </div>`;
    }
  });
  return out;
}
function submitQuantity(habitId){
  const amtEl=document.getElementById('qty_'+habitId);
  const lblEl=document.getElementById('lbl_'+habitId);
  const amt=amtEl?amtEl.value:0;
  const lbl=lblEl?lblEl.value.trim():'';
  addQuantity(habitId, amt, lbl);
}
function addQuantity(habitId, amount, label){
  amount=parseFloat(amount);
  if(isNaN(amount) || amount<=0){ toast('Enter a number greater than 0'); return; }
  const t=todayStr();
  const entry=ensureEntry(t);
  const before=wasFullyCompliant(t);
  const def=getHabitDef(habitId);
  const priorTotal=(entry.quantities[habitId] && entry.quantities[habitId].total) || 0;
  if(!entry.quantities[habitId]) entry.quantities[habitId]={total:0, logs:[]};
  entry.quantities[habitId].total+=amount;
  entry.quantities[habitId].logs.push({amount, label: label||null, ts:Date.now()});
  if(label){ settings.lastBook=label; persist('settings', settings); }
  if(def){
    const newTotal=entry.quantities[habitId].total;
    if(def.kind==='quantity'){
      if(priorTotal<def.goal && newTotal>=def.goal){ animId=habitId; animDir='in'; }
    }else if(def.kind==='budget' || def.kind==='alcohol'){
      if(priorTotal===0){ animId=habitId; animDir='in'; }
    }
  }
  saveEntriesSoon();
  checkCelebration(t, before);
  renderToday();
}
function removeQuantityLog(habitId, idx){
  const t=todayStr();
  const entry=ensureEntry(t);
  const before=wasFullyCompliant(t);
  const q=entry.quantities[habitId];
  if(!q || !q.logs[idx]) return;
  const removed=q.logs.splice(idx,1)[0];
  q.total=Math.max(0, q.total-removed.amount);
  saveEntriesSoon();
  checkCelebration(t, before);
  renderToday();
}

/* ---------- STATS ---------- */
function renderStats(){
  document.getElementById('headerTitle').textContent='Stats';
  document.getElementById('headerSub').textContent=sortedDates().length+' days logged';

  let html='<div class="card"><h2>Perfect days</h2>';
  const perfectAll=sortedDates().filter(d=>isPerfectDay(entries[d], d)).length;
  html+=row('Total perfect days', perfectAll);
  html+=row('Current perfect streak', currentStreak(perfectDayCondition()));
  html+=row('Best perfect streak', bestStreak(perfectDayCondition()));
  html+='</div>';

  html+='<div class="card"><h2>Positive habits — all time</h2>';
  habitsConfig.positive.forEach(h=>{
    if(h.kind==='weight') return;
    if(h.kind==='quantity'){
      html+=`<div class="stat-row"><span>${h.name}</span><span class="n mono">${quantityAllTime(h)} ${h.unit} total · ${allTimeCount(h.id)} days at goal · 🔥${currentStreak(e=>habitDone(e,h))} now</span></div>`;
    }else if(h.kind==='weekly-goal'){
      const wk=weeklyGoalCountThrough(h, todayStr());
      html+=`<div class="stat-row"><span>${h.name}</span><span class="n mono">${allTimeCount(h.id)} days total · ${wk}/${h.weeklyGoal} this week</span></div>`;
    }else{
      html+=`<div class="stat-row"><span>${h.name}</span><span class="n mono">${allTimeCount(h.id)} done · 🔥${currentStreak(e=>habitDone(e,h))} now · best ${bestStreak(e=>habitDone(e,h))}</span></div>`;
    }
  });
  html+='</div>';

  html+=renderWeightStatsCard();

  habitsConfig.positive.filter(h=>h.kind==='quantity' && h.periodStats).forEach(h=>{
    const bp=bestPeriodStats(h);
    html+=`<div class="card"><h2>${h.name} — bests</h2>`;
    html+=row('All-time '+h.unit, bp.allTime);
    html+=row('Best day', bp.bestDay.date? bp.bestDay.total+' '+h.unit+' · '+bp.bestDay.date : '—');
    html+=row('Best week', bp.bestWeek.key? bp.bestWeek.total+' '+h.unit+' · '+formatWeekKey(bp.bestWeek.key) : '—');
    html+=row('Best month', bp.bestMonth.key? bp.bestMonth.total+' '+h.unit+' · '+formatMonthKey(bp.bestMonth.key) : '—');
    html+=row('Best year', bp.bestYear.key? bp.bestYear.total+' '+h.unit+' · '+bp.bestYear.key : '—');
    html+='</div>';
  });

  html+='<div class="card"><h2>Watch-outs — all time</h2>';
  habitsConfig.negative.forEach(h=>{
    if(h.kind==='budget'){
      const wk=cheatWeeklyCountThrough(todayStr(), h);
      html+=`<div class="stat-row"><span>${h.name}</span><span class="n mono">${allTimeCount(h.id)} days used · ${wk}/${h.weeklyLimit} this week · ${cheatViolationCount(h)} over budget</span></div>`;
    }else if(h.kind==='alcohol'){
      html+=`<div class="stat-row"><span>${h.name}</span><span class="n mono">${allTimeCount(h.id)} days used · ${alcoholViolationCount(h)} violations · ${currentStreak(e=>!habitDone(e,h))}d clean now</span></div>`;
    }else{
      html+=`<div class="stat-row"><span>${h.name}</span><span class="n mono">${allTimeCount(h.id)} slips · ${currentStreak(e=>!habitDone(e,h))}d clean now</span></div>`;
    }
  });
  html+='</div>';

  html+='<div class="card"><h2>Last 7 days</h2>'+last7grid()+'</div>';

  document.getElementById('main').innerHTML=html;
}
function row(label,val){
  return `<div class="stat-row"><span>${label}</span><span class="n mono">${val}</span></div>`;
}
function renderWeightStatsCard(){
  const weightDef=habitsConfig.positive.find(h=>h.kind==='weight');
  if(!weightDef) return '';
  const weeks=Object.keys(weightLog).sort();
  if(!weeks.length) return '';
  const first=weightLog[weeks[0]], last=weightLog[weeks[weeks.length-1]];
  const change=last.value-first.value;
  let html='<div class="card"><h2>'+weightDef.name+'</h2>';
  html+=row('Latest', last.value+' '+weightDef.unit+' · '+last.dateLogged);
  html+=row('Starting', first.value+' '+weightDef.unit+' · '+first.dateLogged);
  html+=row('Change', (change>0?'+':'')+change.toFixed(1)+' '+weightDef.unit);
  weeks.slice(-6).reverse().forEach(wk=>{
    const w=weightLog[wk];
    html+=`<div class="stat-row"><span>${w.dateLogged}</span><span class="n mono">${w.value} ${weightDef.unit} <button class="link-btn" style="margin-left:8px;" onclick="editWeight('${wk}')">edit</button></span></div>`;
  });
  html+='</div>';
  return html;
}
function last7grid(){
  let html='<div class="grid14">';
  const d=new Date();
  const days=[];
  for(let i=6;i>=0;i--){
    const dd=new Date(d); dd.setDate(d.getDate()-i);
    days.push(fmtDate(dd));
  }
  days.forEach(ds=>{
    const entry=entries[ds];
    const label=new Date(ds+'T00:00:00').toLocaleDateString(undefined,{weekday:'narrow'});
    let cls='dot';
    if(entry){
      if(isPerfectDay(entry, ds)) cls+=' perfect';
      else if(habitsConfig.negative.some(h=>habitDone(entry,h))) cls+=' slip';
      else cls+=' partial';
    }
    html+=`<div class="${cls}">${label}</div>`;
  });
  html+='</div>';
  return html;
}

/* ---------- JOURNAL ---------- */
function renderJournal(){
  document.getElementById('headerTitle').textContent='Journal';
  document.getElementById('headerSub').textContent=niceDate(todayStr());
  const t=todayStr();
  const entry=ensureEntry(t);

  let html='<div class="card"><h2>Today\'s entry</h2>';
  if(!journalDraft.treeId){
    html+='<label class="field">Choose a prompt tree</label>';
    html+='<select onchange="startTree(this.value)"><option value="">— select —</option>';
    journalTrees.forEach(tr=>{
      const done=entry.journal.completed.includes(tr.id);
      html+=`<option value="${tr.id}">${tr.name}${done?' ✓ done today':''}</option>`;
    });
    html+='</select>';
  }else{
    const tr=journalTrees.find(x=>x.id===journalDraft.treeId);
    const saved=entry.journal.trees[tr.id]||{};
    const idx=journalDraft.index;
    const total=tr.prompts.length;
    html+=`<div class="muted">${tr.name} · prompt ${idx+1} of ${total}</div>`;
    html+=`<div class="prompt-text">${resolvePromptText(tr, saved, idx)}</div>`;
    html+=`<textarea id="journalInput" placeholder="Write until you're done...">${(saved[idx]||'')}</textarea>`;
    html+='<div class="row" style="margin-top:12px;justify-content:space-between;">';
    html+=`<button class="btn ghost" onclick="exitTree()">Back</button>`;
    if(idx<total-1){
      html+=`<button class="btn" onclick="nextPrompt('${tr.id}', ${idx}, ${total})">Save &amp; next</button>`;
    }else{
      html+=`<button class="btn" onclick="finishTree('${tr.id}', ${idx})">Finish</button>`;
    }
    html+='</div>';
  }
  html+='</div>';

  html+='<div class="card"><h2>Past entries</h2>';
  const dates=sortedDates().filter(d=>Object.keys(entries[d].journal.trees).length>0).reverse();
  if(dates.length===0){ html+='<div class="muted">Nothing written yet.</div>'; }
  dates.slice(0,30).forEach(d=>{
    const dEntry=entries[d];
    Object.keys(dEntry.journal.trees).forEach(trId=>{
      const tr=journalTrees.find(x=>x.id===trId);
      if(!tr) return;
      html+=`<div style="margin-bottom:10px;">
        <div class="muted mono" style="margin-bottom:2px;">${d} · ${tr.name}</div>
        <button class="link-btn" onclick="viewPast('${d}','${trId}')">Read entry</button>
      </div>`;
    });
  });
  html+='</div>';

  document.getElementById('main').innerHTML=html;
}
function startTree(id){
  if(!id) return;
  const t=todayStr();
  const entry=ensureEntry(t);
  const saved=entry.journal.trees[id]||{};
  const tr=journalTrees.find(x=>x.id===id);
  let nextIdx=0;
  while(saved[nextIdx]!==undefined && nextIdx<tr.prompts.length-1) nextIdx++;
  journalDraft={treeId:id, index:nextIdx};
  renderJournal();
}
function exitTree(){ journalDraft={treeId:null, index:0}; renderJournal(); }
function currentDraftText(){
  const el=document.getElementById('journalInput');
  return el ? el.value : '';
}
function nextPrompt(treeId, idx, total){
  const t=todayStr();
  const entry=ensureEntry(t);
  if(!entry.journal.trees[treeId]) entry.journal.trees[treeId]={};
  entry.journal.trees[treeId][idx]=currentDraftText();
  saveEntriesSoon();
  journalDraft={treeId, index:Math.min(idx+1, total-1)};
  renderJournal();
}
function finishTree(treeId, idx){
  const t=todayStr();
  const entry=ensureEntry(t);
  const before=wasFullyCompliant(t);
  if(!entry.journal.trees[treeId]) entry.journal.trees[treeId]={};
  entry.journal.trees[treeId][idx]=currentDraftText();
  if(!entry.journal.completed.includes(treeId)) entry.journal.completed.push(treeId);
  entry.habits['journal']=true;
  saveEntriesSoon();
  journalDraft={treeId:null, index:0};
  toast('Entry saved');
  checkCelebration(t, before);
  renderJournal();
}
function resolvePromptText(tree, answersObj, index){
  const text=tree.prompts[index];
  return text.replace(/\{(\d+)\}/g, (m, n)=>{
    const ans=answersObj && answersObj[n];
    return (ans && String(ans).trim()) ? String(ans).trim() : '\u2014';
  });
}
function viewPast(date, treeId){
  const entry=entries[date];
  const tr=journalTrees.find(x=>x.id===treeId);
  if(!entry || !tr) return;
  const answers=entry.journal.trees[treeId]||{};
  let html='<div class="card"><h2>'+date+' · '+tr.name+'</h2>';
  tr.prompts.forEach((p,i)=>{
    if(answers[i]===undefined) return;
    html+=`<div style="margin-bottom:14px;"><div class="muted" style="margin-bottom:4px;">${resolvePromptText(tr, answers, i)}</div><div>${(answers[i]||'').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div></div>`;
  });
  html+='<button class="btn ghost" onclick="renderJournal()">Back to journal</button></div>';
  document.getElementById('main').innerHTML=html;
}

/* ---------- SETTINGS ---------- */
function renderSettings(){
  document.getElementById('headerTitle').textContent='Settings';
  document.getElementById('headerSub').textContent='Configure your log';

  let html='<div class="card"><h2>Start date</h2>';
  html+=`<input type="date" value="${settings.startDate}" onchange="updateStartDate(this.value)">`;
  html+='</div>';

  html+='<div class="card"><h2>Do-these habits</h2>';
  habitsConfig.positive.forEach((h,i)=>{
    html+=`<div class="prompt-line"><input type="text" value="${h.name}" onchange="renameHabit('positive',${i},this.value)"><button class="icon-btn" onclick="removeHabit('positive',${i})">✕</button></div>`;
    if(h.kind==='weekly-goal'){
      html+=`<div class="row" style="margin:-2px 0 10px;">
        <div style="flex:1;"><div class="muted" style="font-size:11px;margin-bottom:3px;">Times per week</div><input type="number" value="${h.weeklyGoal}" onchange="updatePositiveField(${i},'weeklyGoal',this.value)"></div>
      </div>`;
    }
  });
  html+='<button class="btn ghost" onclick="addHabit(\'positive\')">+ Add habit</button></div>';

  html+='<div class="card"><h2>Limit-these habits</h2>';
  habitsConfig.negative.forEach((h,i)=>{
    html+=`<div class="prompt-line"><input type="text" value="${h.name}" onchange="renameHabit('negative',${i},this.value)"><button class="icon-btn" onclick="removeHabit('negative',${i})">✕</button></div>`;
    if(h.kind==='budget'){
      html+=`<div class="row" style="margin:-2px 0 10px;">
        <div style="flex:1;"><div class="muted" style="font-size:11px;margin-bottom:3px;">Weekly limit</div><input type="number" value="${h.weeklyLimit}" onchange="updateBudget(${i},'weeklyLimit',this.value)"></div>
        <div style="flex:1;"><div class="muted" style="font-size:11px;margin-bottom:3px;">Daily max</div><input type="number" value="${h.dailyLimit}" onchange="updateBudget(${i},'dailyLimit',this.value)"></div>
      </div>`;
    }else if(h.kind==='alcohol'){
      html+=`<div class="row" style="margin:-2px 0 10px;">
        <div style="flex:1;"><div class="muted" style="font-size:11px;margin-bottom:3px;">Daily limit (drinks)</div><input type="number" value="${h.dailyLimit}" onchange="updateBudget(${i},'dailyLimit',this.value)"></div>
        <div style="flex:1;"><div class="muted" style="font-size:11px;margin-bottom:3px;">Water tax / drink (oz)</div><input type="number" value="${h.taxPerDrink}" onchange="updateBudget(${i},'taxPerDrink',this.value)"></div>
      </div>`;
    }
  });
  html+='<button class="btn ghost" onclick="addHabit(\'negative\')">+ Add watch-out</button></div>';

  html+='<div class="card"><h2>Journal prompt trees</h2>';
  html+='<div class="muted" style="margin-bottom:10px;">Tip: put {0}, {1}, etc. in a prompt to pull in your answer from that numbered prompt above — numbers start at 0 and are shown next to each prompt below.</div>';
  journalTrees.forEach((tr,ti)=>{
    html+=`<div class="tree-editor">
      <div class="prompt-line"><input type="text" value="${tr.name}" onchange="renameTree(${ti},this.value)"><button class="icon-btn" onclick="removeTree(${ti})">✕</button></div>`;
    tr.prompts.forEach((p,pi)=>{
      html+=`<div class="prompt-line"><span class="muted mono" style="flex:0 0 auto;padding:9px 4px;">${pi}</span><input type="text" value="${p.replace(/"/g,'&quot;')}" onchange="editPrompt(${ti},${pi},this.value)"><button class="icon-btn" onclick="removePrompt(${ti},${pi})">✕</button></div>`;
    });
    html+=`<button class="link-btn" onclick="addPrompt(${ti})">+ add prompt</button>
    </div>`;
  });
  html+='<button class="btn ghost" onclick="addTree()">+ Add prompt tree</button></div>';

  html+='<div class="card"><h2>Backup</h2><div class="muted" style="margin-bottom:8px;">Export a safety copy any time, or bring in a backup from the old version.</div><div class="row"><button class="btn ghost" onclick="renderExportData()">Export my data</button><button class="btn ghost" onclick="renderImportData()">Import a backup</button></div></div>';

  html+='<div class="card"><h2>Account</h2><button class="btn ghost" onclick="doSignOut()">Sign out</button></div>';

  html+='<div class="card"><h2>Danger zone</h2><button class="btn danger" onclick="resetAll()">Erase all data</button></div>';

  document.getElementById('main').innerHTML=html;
}
function updateStartDate(v){ settings.startDate=v; persist('settings',settings); renderSettings(); }
function renameHabit(type,i,val){ habitsConfig[type][i].name=val; persist('habits-config',habitsConfig); }
function removeHabit(type,i){ habitsConfig[type].splice(i,1); persist('habits-config',habitsConfig); renderSettings(); }
function updateBudget(i, field, val){
  const n=parseInt(val,10);
  if(!isNaN(n) && n>=0){ habitsConfig.negative[i][field]=n; persist('habits-config',habitsConfig); }
  renderSettings();
}
function updatePositiveField(i, field, val){
  const n=parseInt(val,10);
  if(!isNaN(n) && n>=0){ habitsConfig.positive[i][field]=n; persist('habits-config',habitsConfig); }
  renderSettings();
}
function addHabit(type){
  const name=prompt('Name this habit:');
  if(!name) return;
  const id=type+'_'+Date.now();
  habitsConfig[type].push({id,name});
  persist('habits-config',habitsConfig); renderSettings();
}
function renameTree(i,val){ journalTrees[i].name=val; persist('journal-trees',journalTrees); }
function removeTree(i){ journalTrees.splice(i,1); persist('journal-trees',journalTrees); renderSettings(); }
function addTree(){
  journalTrees.push({id:'tree_'+Date.now(), name:'New tree', prompts:['New prompt']});
  persist('journal-trees',journalTrees); renderSettings();
}
function editPrompt(ti,pi,val){ journalTrees[ti].prompts[pi]=val; persist('journal-trees',journalTrees); }
function removePrompt(ti,pi){ journalTrees[ti].prompts.splice(pi,1); persist('journal-trees',journalTrees); renderSettings(); }
function addPrompt(ti){ journalTrees[ti].prompts.push('New prompt'); persist('journal-trees',journalTrees); renderSettings(); }
function resetAll(){
  if(!confirm('This erases every logged day and journal entry. Are you sure?')) return;
  entries={};
  persist('entries', entries);
  toast('All data erased');
  renderStats();
}
function renderExportData(){
  const bundle={habitsConfig, journalTrees, entries, settings, weightLog, exportedAt:new Date().toISOString()};
  const json=JSON.stringify(bundle, null, 2);
  let html='<div class="card"><h2>Export your data</h2>';
  html+='<div class="muted" style="margin-bottom:10px;">Tap "Copy," then paste it somewhere safe — Notes app, an email to yourself, or straight into the Import box on the new standalone app.</div>';
  html+=`<textarea id="exportBox" style="min-height:240px;font-size:11px;" readonly>${json.replace(/</g,'&lt;')}</textarea>`;
  html+='<div class="row" style="margin-top:10px;">';
  html+='<button class="btn" onclick="copyExport()">Copy to clipboard</button>';
  html+='<button class="btn ghost" onclick="renderSettings()">Back</button>';
  html+='</div></div>';
  document.getElementById('main').innerHTML=html;
}
function copyExport(){
  const box=document.getElementById('exportBox');
  box.focus(); box.select();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(box.value).then(()=>toast('Copied!')).catch(()=>toast('Select the text above and copy manually'));
  }else{
    toast('Select the text above and copy manually');
  }
}
function renderImportData(){
  let html='<div class="card"><h2>Import a backup</h2>';
  html+='<div class="muted" style="margin-bottom:10px;">Paste the text you copied from the old version\'s Export screen, then tap Import. This overwrites what\'s currently here.</div>';
  html+='<textarea id="importBox" style="min-height:200px;font-size:12px;" placeholder="Paste your exported data here..."></textarea>';
  html+='<div class="row" style="margin-top:10px;">';
  html+='<button class="btn" onclick="doImport()">Import</button>';
  html+='<button class="btn ghost" onclick="renderSettings()">Back</button>';
  html+='</div></div>';
  document.getElementById('main').innerHTML=html;
}
async function doImport(){
  const raw=document.getElementById('importBox').value;
  let bundle;
  try{ bundle=JSON.parse(raw); }catch(e){ toast("That doesn't look like valid backup text"); return; }
  if(bundle.habitsConfig){ habitsConfig=bundle.habitsConfig; await persist('habits-config', habitsConfig); }
  if(bundle.journalTrees){ journalTrees=bundle.journalTrees; await persist('journal-trees', journalTrees); }
  if(bundle.entries){ entries=bundle.entries; await persist('entries', entries); }
  if(bundle.settings){ settings=bundle.settings; await persist('settings', settings); }
  if(bundle.weightLog){ weightLog=bundle.weightLog; await persist('weight-log', weightLog); }
  toast('Imported!');
  switchTab('today');
}
function doSignOut(){
  if(!confirm('Sign out of The Log?')) return;
  window.__fb.signOut(window.__fb.auth);
}
window.init=init;
</script>
